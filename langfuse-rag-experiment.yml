name: Langfuse RAG quality gate

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  rag-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: langfuse/experiment-action@v1.0.8
        env:
          CANDIDATE_ENDPOINT: ${{ secrets.CANDIDATE_ENDPOINT }}
          MIN_RAG_QUALITY: "0.80"
        with:
          langfuse_public_key: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          langfuse_secret_key: ${{ secrets.LANGFUSE_SECRET_KEY }}
          langfuse_base_url: https://cloud.langfuse.com
          experiment_path: rag-evaluation.ts
          dataset_name: rag-regression-set
          dataset_version: "2026-08-13T00:00:00Z"
          js_sdk_version: 5.10.0
          github_token: ${{ github.token }}
